<text x="50.0" y="752" font-size="16" font-weight="bold" fill="#27598C">Left side (zone 4)</text>
<text x="50.0" y="784" font-size="20" font-weight="bold" fill="#1B3350">1</text>
<text x="122.0" y="784" font-size="14" fill="#33414F">High ball to the left antenna (zone</text>
<text x="122.0" y="803" font-size="14" fill="#33414F">4). Most time for the attacker.</text>
<text x="50.0" y="841" font-size="20" font-weight="bold" fill="#1B3350">0</text>
<text x="122.0" y="841" font-size="14" fill="#33414F">Lower, faster ball to the left</text>
<text x="122.0" y="860" font-size="14" fill="#33414F">antenna.</text>
<text x="50.0" y="898" font-size="20" font-weight="bold" fill="#1B3350">2</text>
<text x="122.0" y="898" font-size="14" fill="#33414F">Medium-fast ball landing about 1.5 m</text>
<text x="122.0" y="917" font-size="14" fill="#33414F">inside the left antenna.</text>
<rect x="500.0" y="720" width="426.0" height="5" fill="#C2410C"/>
<text x="500.0" y="752" font-size="16" font-weight="bold" fill="#C2410C">Middle (zone 3), in front of the setter</text>
<text x="500.0" y="784" font-size="20" font-weight="bold" fill="#1B3350">Shoot</text>
<text x="572.0" y="784" font-size="14" fill="#33414F">Flat, fast ball between zone 4 and</text>
<text x="572.0" y="803" font-size="14" fill="#33414F">the middle.</text>
<text x="500.0" y="841" font-size="20" font-weight="bold" fill="#1B3350">4</text>
<text x="572.0" y="841" font-size="14" fill="#33414F">Higher ball just in front of the</text>
<text x="572.0" y="860" font-size="14" fill="#33414F">setter. More time for the middle.</text>
<text x="500.0" y="898" font-size="20" font-weight="bold" fill="#1B3350">Po</text>
<text x="572.0" y="898" font-size="14" fill="#33414F">Low quick just in front of the</text>
<text x="572.0" y="917" font-size="14" fill="#33414F">setter.</text>
<rect x="950.0" y="720" width="426.0" height="5" fill="#1E1E1E"/>
<text x="950.0" y="752" font-size="16" font-weight="bold" fill="#1E1E1E">Behind the setter / right side (zone 2)</text>
<text x="950.0" y="784" font-size="20" font-weight="bold" fill="#1B3350">Til</text>
<text x="1022.0" y="784" font-size="14" fill="#33414F">Short quick just behind the setter.</text>
<text x="950.0" y="822" font-size="20" font-weight="bold" fill="#1B3350">7</text>
<text x="1022.0" y="822" font-size="14" fill="#33414F">Lower, faster back set to the right</text>
<text x="1022.0" y="841" font-size="14" fill="#33414F">antenna.</text>
<text x="950.0" y="879" font-size="20" font-weight="bold" fill="#1B3350">6</text>
<text x="1022.0" y="879" font-size="14" fill="#33414F">High back set to the right antenna</text>
<text x="1022.0" y="898" font-size="14" fill="#33414F">(zone 2).</text>
<text x="50" y="995" font-size="12" fill="#8A96A3">KSV | Front row sets · lower arc = faster tempo · set names as used in the KSV guide</text>
